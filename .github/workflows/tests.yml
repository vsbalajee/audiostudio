name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-engine:
    name: Python ${{ matrix.python-version }} / FFmpeg
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install open-source audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-tk
          ffmpeg -version | head -n 1
      - name: Syntax check
        run: python -m compileall -q scripts tests
      - name: Run synthetic audio processing tests
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Validate packaged skill
        run: python scripts/build_skill_zip.py --check
